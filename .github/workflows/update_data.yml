name: Update Market Data

on:
  workflow_dispatch:

  schedule:
    - cron: "30 7 * * 1-5"
      timezone: "Asia/Seoul"

permissions:
  contents: write

jobs:
  update-market-data:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance pykrx

      - name: Update market database
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          python -c "from data_loader import update_database; update_database()"

      - name: Commit database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add market_data.db

          git diff --cached --quiet || git commit -m "Update market data"

          git push